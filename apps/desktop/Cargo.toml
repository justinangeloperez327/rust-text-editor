[package]
name = "rust-text-editor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ide-core = { path = "../../crates/ide-core" }
ide-document = { path = "../../crates/ide-document" }
ide-settings = { path = "../../crates/ide-settings" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# GPUI is pinned for the first Windows compatibility assessment.
gpui = { version = "=0.2.2", default-features = false }
